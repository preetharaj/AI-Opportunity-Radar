name: Phase 3 — Link-Rot Checker

# Independent weekly schedule from discovery.yml, per PRD §7.3/§8 ("these
# are independent, non-blocking jobs"). This workflow NEVER has `contents:
# write` permission — it only needs to read the repo and open an issue,
# which is itself a small structural guarantee on top of the script-level
# guarantee in check-links.mjs (no write helper imported at all).
#
# Non-blocking by construction, not just convention:
#   - No `pull_request` trigger exists here, so this can never become a
#     required status check on someone's PR.
#   - No `needs:` dependency on or from discovery.yml — a crash here can't
#     stall that job, and vice versa.
#   - Nothing in this workflow touches the Vercel deploy hook; that's
#     triggered by pushes/merges to `main`, which this workflow never makes.
#   - If this job fails outright (e.g. GITHUB_TOKEN issue), it fails loud in
#     the Actions tab for a maintainer to notice on their own time — it does
#     not surface as a red X on anyone's unrelated PR.
on:
  schedule:
    - cron: "0 7 * * 3" # Wednesday 07:00 UTC — offset from discovery's daily runs
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install script dependencies
        working-directory: scripts/phase3
        run: npm install --no-save @octokit/rest octokit-plugin-create-pull-request

      - name: Run link checker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/phase3/check-links.mjs
