name: Email Notifications

on:
  schedule:
    - cron: "0 8 * * *"    # Daily 08:00 UTC — followed-opportunity reminders
    - cron: "15 8 * * 1"   # Monday 08:15 UTC — weekly closing roundup
    - cron: "30 8 * * 1"   # Monday 08:30 UTC — biweekly digest (policy gates to every 2nd Monday)
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase: daily | weekly | biweekly"
        required: true
        default: biweekly
        type: choice
        options: [daily, weekly, biweekly]

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve phase
        id: phase
        run: |
          if [ -n "${{ github.event.inputs.phase }}" ]; then
            echo "phase=${{ github.event.inputs.phase }}" >> "$GITHUB_OUTPUT"
          else
            case "$(date -u +%M)" in
              00) echo "phase=daily"    >> "$GITHUB_OUTPUT" ;;
              15) echo "phase=weekly"   >> "$GITHUB_OUTPUT" ;;
              *)  echo "phase=biweekly" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      # call_phase daily
      # call_phase weekly
      # call_phase biweekly
      - name: Run ${{ steps.phase.outputs.phase }} notifications
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          PHASE="${{ steps.phase.outputs.phase }}"
          CURSOR=""
          BATCH=0

          while true; do
            BATCH=$((BATCH+1))
            [ -n "$CURSOR" ] && QS="phase=${PHASE}&cursor=${CURSOR}" || QS="phase=${PHASE}"

            BODY=$(curl -sS -X POST "${SITE_URL}/api/notify?${QS}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              --fail-with-body \
              -w "\n__STATUS_%{http_code}__")

            STATUS=$(echo "$BODY" | grep -oP '(?<=__STATUS_)\d+(?=__)' || echo 0)
            BODY=$(echo "$BODY" | sed 's/__STATUS_[0-9]*__//')
            echo "Batch $BATCH HTTP $STATUS: $BODY"

            if [ "$STATUS" != "200" ] && [ "$STATUS" != "207" ]; then
              echo "Error HTTP $STATUS" && exit 1
            fi

            # hasMore / nextCursor drive pagination across 3.2k+ subscribers
            HAS_MORE=$(echo "$BODY" | grep -oP '"hasMore"\s*:\s*\K(true|false)' || echo false)
            CURSOR=$(echo "$BODY" | grep -oP '"nextCursor"\s*:\s*"\K[^"]+' || echo "")

            [ "$HAS_MORE" != "true" ] || [ -z "$CURSOR" ] && { echo "Done after $BATCH batch(es)"; break; }
            [ "$BATCH" -ge 50 ] && { echo "Safety limit hit"; exit 1; }
          done
