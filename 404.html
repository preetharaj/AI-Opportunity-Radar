<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="5; url=https://mapd.cc/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Opportunity Radar has moved</title>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, Arial, sans-serif;
        background: linear-gradient(135deg, #f8fafc, #eef2ff);
        color: #0f172a;
      }

      .card {
        max-width: 560px;
        padding: 40px;
        border-radius: 24px;
        background: white;
        box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
      }

      p {
        color: #475569;
        line-height: 1.6;
      }

      .button {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 20px;
        border-radius: 999px;
        background: #4f46e5;
        color: white;
        text-decoration: none;
        font-weight: 600;
      }

      .small {
        margin-top: 16px;
        font-size: 14px;
        color: #64748b;
      }
    </style>
  </head>

  <body>
    <main class="card">
      <h1>AI Opportunity Radar has moved</h1>

      <p>
        The latest version is now available at
        <strong>mapd.cc</strong>.
        You will be redirected automatically in a few seconds.
      </p>

      <a
        class="button"
        href="https://mapd.cc/"
      >
        Go to AI Opportunity Radar →
      </a>

      <p class="small">
        If you are not redirected automatically,
        click the button above.
      </p>
    </main>
  </body>
</html>
